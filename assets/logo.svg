  <g stroke-linecap="round" stroke-width="24">
    <line x1="104" y1="392" x2="408" y2="88" stroke="#e5484d"/>
    <line x1="408" y1="392" x2="104" y2="88" stroke="#3b82f6"/>
  </g>
  <rect x="236" y="94" width="40" height="34" rx="8" fill="#ffffff"/>
  <circle cx="256" cy="250" r="112" fill="#0b0b0c" stroke="#ffffff" stroke-width="22"/>
  <g stroke="#ffffff" stroke-width="17" stroke-linecap="round">
    <line x1="256" y1="250" x2="256" y2="172"/>
    <line x1="256" y1="250" x2="314" y2="280"/>
  </g>
  <circle cx="256" cy="250" r="14" fill="#ffffff"/>
  <text x="256" y="462" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="62" letter-spacing="10">CHRONO</text>
