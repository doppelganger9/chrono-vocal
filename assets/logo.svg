<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Chrono Canne">
  <!-- Variante A : deux cannes croisées devant un cadran de chronomètre -->
  <rect width="512" height="512" rx="112" fill="#0d0f12"/>
  <g stroke-linecap="round">
    <line x1="92" y1="428" x2="420" y2="100" stroke="#c98b4a" stroke-width="24"/>
    <line x1="420" y1="428" x2="92" y2="100" stroke="#c98b4a" stroke-width="24"/>
    <line x1="92" y1="428" x2="140" y2="380" stroke="#8a5a2b" stroke-width="30"/>
    <line x1="420" y1="428" x2="372" y2="380" stroke="#8a5a2b" stroke-width="30"/>
  </g>
  <rect x="234" y="112" width="44" height="36" rx="9" fill="#ffb020"/>
  <circle cx="256" cy="280" r="124" fill="#0d0f12" stroke="#ffb020" stroke-width="24"/>
  <g stroke="#f2f4f7" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="280" x2="256" y2="196"/>
    <line x1="256" y1="280" x2="318" y2="312"/>
  </g>
  <circle cx="256" cy="280" r="15" fill="#ffb020"/>
</svg>
