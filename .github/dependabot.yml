# Montées de version des dépendances (#17) : une PR groupée par mois, des versions publiées depuis au moins
# 7 jours (« cooldown » : évite les versions retirées ou incomplètes), fusion automatique si « Tests » passe.
# Les alertes et correctifs de sécurité, eux, ne suivent pas ce calendrier.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      outils-de-developpement:
        dependency-type: development
        patterns: ["*"]
    open-pull-requests-limit: 2
    labels: [technique]
    commit-message:
      prefix: "Dépendances"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions-github:
        patterns: ["*"]
    labels: [technique]
    commit-message:
      prefix: "Actions GitHub"
