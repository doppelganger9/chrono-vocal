# Publication de chaque version (#91, #39). Quand des notes de changements/ arrivent sur main, la CI en fait une
# version : CHANGELOG.md, numéro recopié partout, js/notes.js (scripts/publier.js). Ce commit part dans une PR
# « Version X.Y.Z » (un push direct sur main est refusé, #101). GitHub y met « Tests » en attente : David clique
# « Approve and run » (sa décision, #101), et c'est « Tests », une fois vert, qui fusionne, étiquette et publie
# (job « publication » de tests.yml).
# Pas de boucle : une PR ou une fusion faite avec GITHUB_TOKEN ne relance aucun workflow, et sans note il n'y a rien à publier.
name: Version

on:
  push:
    branches: [main]
    paths: ["changements/**"]
  workflow_dispatch:

# une publication à la fois : la suivante repart du main laissé par la précédente
concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write # branche publication
  pull-requests: write # PR « Version X.Y.Z »

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PR « Version X.Y.Z », mise à jour si elle est déjà ouverte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publier.js
          [ -n "$(git status --porcelain)" ] || { echo "Rien à publier"; exit 0; }
          v="$(node -p 'require("./package.json").version')"
          git add -A && git commit -q -m "Version $v"
          # repartie de main à chaque fois : de nouvelles notes arrivées entre-temps rejoignent la même version
          git push -q -f origin HEAD:refs/heads/publication
          pr="$(gh pr list --head publication --base main --state open --json number -q '.[0].number')"
          body="Publication automatique des notes de changements/ (#91, #101). Approuver « Tests » (Approve and run) : une fois vert, il fusionne, étiquette et publie."
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Version $v" --body "$body" > /dev/null
          else
            gh pr create --base main --head publication --title "Version $v" --body "$body" > /dev/null
          fi
          echo "::notice::PR « Version $v » : approuver « Tests » (Approve and run) pour la publier"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
