# Analyse de sécurité du code (#34) : CodeQL, gratuit sur un dépôt public. Le JavaScript de l'app et des scripts,
# et les workflows GitHub eux-mêmes. À chaque PR, sur main, et une fois par semaine (nouvelles règles d'analyse).
# Les alertes apparaissent dans l'onglet Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # le lundi à 5 h 17 (UTC)

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    # pas sur les PR de Dependabot : elles ne touchent pas au code analysé
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
