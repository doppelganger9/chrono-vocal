name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # lancé aussi par « Version » sur le commit de version, avant qu'il n'arrive sur main (#91)
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # failles connues des dépendances (#34) : seuil « high », les moindres passent par les correctifs groupés de Dependabot
      - name: Audit des dépendances
        run: npm audit --audit-level=high
      # notes de changements/ bien formées, version jamais changée à la main : elle est calculée à la fusion (#91).
      # Sauf sur la PR « Version X.Y.Z » de la CI (branche publication de ce dépôt), qui change la version (#101)
      - name: Notes de version
        if: >-
          github.event_name == 'pull_request' &&
          !(github.head_ref == 'publication' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git fetch -q --depth=1 origin "$BASE"
          node scripts/publier.js --controler "$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
        env:
          BASE: ${{ github.base_ref }}
      - name: Typage (JSDoc vérifié par TypeScript)
        run: npm run typecheck
      # ESLint, puis Prettier en mode vérification (#36) : npm run format corrige
      - name: Lint et format
        run: npm run lint
      - name: Tests unitaires
        run: npm run test:unit
      - name: Navigateurs de test (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit
      - name: Tests de bout en bout
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
