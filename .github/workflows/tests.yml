name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash avec pipefail : une commande qui échoue dans un tube fait échouer l'étape (tests/unit/workflows.test.js)
defaults:
  run:
    shell: bash

# Durée et solidité (#131, ADR 0008) : les vérifications rapides et un job de bout en bout par navigateur tournent
# en parallèle ; le job final « tests », seul exigé par la protection de main, les attend tous. Les navigateurs et
# leurs dépendances viennent de l'image de Playwright : plus d'apt-get, resté bloqué 33 minutes le 22 octobre 2026.
# Chaque job a un délai maximal : sans lui, GitHub attend 6 heures.
jobs:
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # failles connues des dépendances (#34) : seuil « high », les moindres passent par les correctifs groupés de Dependabot
      - name: Audit des dépendances
        run: npm audit --audit-level=high
      # notes de changements/ bien formées, version jamais changée à la main : elle est calculée à la fusion (#91).
      # Sauf sur la PR « Version X.Y.Z » de la CI (branche publication de ce dépôt), qui change la version (#101)
      - name: Notes de version
        if: >-
          github.event_name == 'pull_request' &&
          !(github.head_ref == 'publication' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git fetch -q --depth=1 origin "$BASE"
          node scripts/publier.js --controler "$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
        env:
          BASE: ${{ github.base_ref }}
      - name: Typage (JSDoc vérifié par TypeScript)
        run: npm run typecheck
      # ESLint, puis Prettier en mode vérification (#36) : npm run format corrige
      - name: Lint et format
        run: npm run lint
      - name: Tests unitaires
        run: npm run test:unit

  # la version de Playwright de package.json, pour prendre l'image qui va avec : une montée de Dependabot suit d'elle-même
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

  # un job par navigateur (Chromium pour Android, WebKit pour l'iPhone), dans l'image de Playwright. WebKit, deux fois
  # plus lent (4,4 min contre 2 min pour Chromium), est coupé en deux morceaux qui tournent en même temps.
  e2e:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host # conseillé pour Chromium dans Docker (mémoire partagée)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { projet: android-chrome, morceau: 1, morceaux: 1 }
          - { projet: iphone-safari, morceau: 1, morceaux: 2 }
          - { projet: iphone-safari, morceau: 2, morceaux: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # les polices des runners Ubuntu, que l'image n'a pas : les tests de mise en page en dépendent
      - name: Polices DejaVu
        run: sh scripts/polices-dejavu.sh
      - name: Tests de bout en bout
        run: npx playwright test --project "$PROJET" --shard "$MORCEAU/$MORCEAUX"
        env:
          PROJET: ${{ matrix.projet }}
          MORCEAU: ${{ matrix.morceau }}
          MORCEAUX: ${{ matrix.morceaux }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.projet }}-${{ matrix.morceau }}
          path: test-results/
          retention-days: 7

  # le contrôle exigé par la protection de main. Sans always(), un job sauté parce qu'un autre a échoué compterait
  # comme réussi ; on échoue donc soi-même si l'un d'eux a échoué ou a été annulé.
  tests:
    needs: [verifications, playwright, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tous les jobs ont réussi
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::un job de vérification ou de bout en bout a échoué"
          exit 1

  # PR « Version X.Y.Z » ouverte par « Version » (#101) : une fois « tests » vert, après l'« Approve and run » de
  # David, on la fusionne, puis on pose l'étiquette vX.Y.Z et on publie la « release » avec la partie du journal.
  publication:
    needs: tests
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'publication' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # la fusion réessaie pendant 15 minutes
    timeout-minutes: 25
    permissions:
      contents: write # fusion, étiquette, release
      pull-requests: write
      pages: write # remettre le site en ligne avec la nouvelle version
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fusion, étiquette et release
        run: |
          v="$(node -p 'require("./package.json").version')"
          # --match-head-commit : un nouveau commit de version arrivé entre-temps attend ses propres tests.
          # GitHub peut voir « tests » en cours plusieurs minutes après sa fin (« base branch policy prohibits the
          # merge » pour la v1.6.0 le 21 octobre, 8 minutes de retard sur la PR #124) : on réessaie pendant 15 minutes,
          # et une PR déjà fusionnée à la main reçoit quand même étiquette et release.
          for i in $(seq 30); do
            gh pr merge "$PR" --merge --match-head-commit "$SHA" && break
            [ "$(gh pr view "$PR" --json state -q .state)" = MERGED ] && break
            [ "$i" -lt 30 ] || exit 1
            sleep 30
          done
          git push -q origin --delete publication || true
          sha="$(gh pr view "$PR" --json mergeCommit -q .mergeCommit.oid)"
          # la partie du journal de cette version : de son titre au titre suivant
          awk -v v="$v" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
          gh release create "v$v" --target "$sha" --title "v$v" --notes-file notes.md
          # une fusion faite avec GITHUB_TOKEN peut ne pas remettre le site en ligne : on le demande
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || echo "::warning::GitHub Pages : mise en ligne non demandée"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
