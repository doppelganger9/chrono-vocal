name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # failles connues des dépendances (#34) : seuil « high », les moindres passent par les correctifs groupés de Dependabot
      - name: Audit des dépendances
        run: npm audit --audit-level=high
      - name: Typage (JSDoc vérifié par TypeScript)
        run: npm run typecheck
      - name: Tests unitaires
        run: npm run test:unit
      - name: Navigateurs de test (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit
      - name: Tests de bout en bout
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
